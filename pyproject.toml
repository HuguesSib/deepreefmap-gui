[project]
name = "deepreefmap-gui"
version = "0.4.1"
description = "Desktop application for semantic 3D mapping of coral reefs with deepreefmap"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Evan Thomas", email = "evan.thomas@epfl.ch" },
]
keywords = ["coral reefs", "semantic mapping", "3d reconstruction", "gui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  # loger/gopro match the features the packaged binary ships (scripts/build_config.env
  # in the library previously listed them as BASE_FEATURES). Pinned to a git commit on
  # the gui-support branch of eceo-epfl/deepreefmap (not PyPI). This direct reference is
  # what dev, CI, and the built wheel's Requires-Dist all resolve, so the PyApp binary's
  # first-run install pulls the library from GitHub at that commit. gui-support is the
  # library-only lineage; the deepreefmap-gui branch is the pre-split monolith this
  # package was extracted from (it still nests the whole app under deepreefmap/gui/), so
  # never pin to it.
  "deepreefmap[loger,gopro] @ git+https://github.com/eceo-epfl/deepreefmap.git@36110a30cc5a16f002da4a1ff0674a97e5b0fa86",
  "PySide6>=6.7,<7",
  "httpx>=0.28,<0.29",
  # The app also imports vtkmodules.* directly (viewer/picking.py,
  # viewer/widget.py) and relies on the vtk that pyvista hard-pins. Deliberately
  # not declared separately: an independent constraint could only conflict with
  # pyvista's, never improve on it.
  "pyvista>=0.44",
  "pyvistaqt>=0.11",
  # System probe (RAM/VRAM/CPU sampling) in profiling/system_probe.py.
  "psutil>=5.9",
  # Survey preset files (survey/preset.py).
  "pyyaml>=6.0.2",
  # Zarr scene-file cache for fast run reloads (io/scene_file.py). Formerly a
  # library dependency; moved here with the scene-file code.
  "zarr>=2.18,<3",
  "numcodecs>=0.12,<0.16",
  # Imported at module level by this package, so an ImportError here is a startup
  # crash rather than a degraded feature. All of these also arrive transitively
  # (via deepreefmap or its extras) today; declaring them means a change upstream
  # breaks resolution at install time instead of at runtime on a field laptop.
  # tests/test_dependency_closure.py enforces that this list stays complete.
  #   platformdirs  paths.py, imported by nearly every module
  #   numpy         io/scene_file.py, viewer/*, runs/loaded_run.py
  #   opencv-python form/video_scrub.py; matches what deepreefmap[gopro] resolves
  #   huggingface-hub  models/manager.py: cache scan, auth and delete are ours
  #   imageio       camera/calibration.py: frame sampling for COLMAP; the ffmpeg
  #                 backend arrives through deepreefmap
  "platformdirs>=4.0",
  # Device token at rest. Imported lazily from sync/credentials.py and only
  # reached from the Server page, so a missing backend degrades to a file.
  "keyring>=24",
  "numpy>=1.26",
  "imageio>=2.37",
  "opencv-python>=4.9",
  "huggingface-hub>=0.30",
  # Function-level imports, but small and universal enough that relying on a
  # transitive path is not worth it: packaging drives the update version
  # ordering (packaging/releases.py), tqdm the download progress shim
  # (models/manager.py). Note [dev] already declares types-tqdm.
  "packaging>=23",
  "tqdm>=4.66",
  # Sampled video hashing for clip identity (io/video_hash.py). Formerly a
  # library dependency; moved here with the video-hash code.
  "imohash>=1.1.0",
]

[project.optional-dependencies]
# Torch variant pins, kept in lockstep with deepreefmap's cu126/cu130/rocm
# extras. Declared here (not chained through the library's extras) because uv
# applies [tool.uv.sources] index routing and extra conflicts only to this
# project's own dependencies, not to a path dependency's.
cu126 = ["torch==2.12.1+cu126", "torchvision==0.27.1+cu126"]
cu130 = ["torch==2.12.1+cu130", "torchvision==0.27.1+cu130"]
rocm = ["torch==2.9.1+rocm6.4", "torchvision==0.24.1+rocm6.4", "pytorch-triton-rocm>=3.0"]
dev = [
  "pytest>=8.4.0",
  # Bounds a hung test: the suite drives Qt event loops and worker threads, and
  # ci.yml would otherwise sit on GitHub's 6-hour job default.
  "pytest-timeout>=2.3",
  "pytest-cov>=5.0",
  # Kept for the -n a machine with the memory for it can pass: the suite is
  # mostly window builds, and each worker is a process with its own
  # QApplication, its own torch and its own temp dirs.
  "pytest-xdist>=3.6",
  "ruff>=0.12.0",
  "mypy>=2.0.0",
  "types-tqdm",
  "types-PyYAML",
]

[project.urls]
Repository = "https://github.com/eceo-epfl/deepreefmap-gui"
Issues = "https://github.com/eceo-epfl/deepreefmap-gui/issues"

[project.scripts]
deepreefmap-gui = "deepreefmap_gui.cli:main"

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["deepreefmap_gui*"]

[tool.setuptools.package-data]
# The registry's contract artefact, which every version constant is derived from
# at import. A wheel without it cannot start.
"deepreefmap_gui.sync.contract" = ["*.json"]
"deepreefmap_gui.resources" = [
  "*.png", "*.icns", "fonts/*.ttf", "fonts/*.txt", "configs/*.yaml",
  # The icon set, vendored so an offline laptop still has one.
  "icons/*.svg", "icons/LICENSE",
]

[tool.uv]
conflicts = [
  [{ extra = "cu126" }, { extra = "cu130" }, { extra = "rocm" }],
]

# Route torch and torchvision to the matching PyTorch wheel index per GPU extra.
# Stripped from published metadata, so the wheel keeps the plain version pins.
[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu130", extra = "cu130" },
  { index = "pytorch-rocm", extra = "rocm" },
]
torchvision = [
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu130", extra = "cu130" },
  { index = "pytorch-rocm", extra = "rocm" },
]
pytorch-triton-rocm = [
  { index = "pytorch-rocm", extra = "rocm" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode: category subfolders under tests/ need no __init__.py and
# test basenames need not be globally unique.
# -ra surfaces the skip reasons, which matters because the torch importorskip in
# tests/gui/conftest.py silently gates most of the GUI suite.
# Serial by default. Each xdist worker is a process with its own QApplication
# and its own torch, which is gigabytes apiece, so "one per core" is a memory
# figure rather than a speed one: on a 32-core desktop -n auto swapped the
# machine to death. Pass -n yourself when the machine can afford it; CI does,
# sized for a hosted runner's memory.
addopts = "--import-mode=importlib -ra --strict-markers --strict-config"
# Puts tests/_factories.py on the path for the category subfolders that share it.
pythonpath = ["tests"]
timeout = 120
# thread, not the signal default: a signal handler is Python-level, so it only
# runs once the interpreter is back from C. A test parked in QDialog::exec()
# never gets there and the timeout never fires -- CI sat on one for five hours.
# The thread method dumps every stack and exits, naming the test.
timeout_method = "thread"
markers = [
  "real_reveal: opt out of the conftest stub that keeps reveals off the desktop",
  "real_modal: opt out of the conftest guard that blocks exec() on dialogs and menus",
]
# Scoped to our own package: VTK and numpy emit deprecations we don't control,
# and drowning those would mean turning the filter off again.
filterwarnings = [
  "error::DeprecationWarning:deepreefmap_gui.*",
  # zarr's ZipStore rewrites .zattrs as it fills each group, so every scene-file
  # write reports duplicate zip entries. Inherent to the store, not our writes.
  "ignore:Duplicate name:UserWarning:zipfile",
]

[tool.ruff]
target-version = "py310"
# 120 rather than ruff's 88: at 88 this codebase reports 434 long lines, at 120
# it reports 5. Qt call sites and the QSS f-strings are naturally wide, and
# reflowing them to 88 would be churn without a readability gain.
line-length = 120
extend-exclude = ["tests/e2e/_cache", "tests/e2e/_work"]

[tool.ruff.lint]
# Beyond ruff's default (F + a little pycodestyle). Chosen by measuring the whole
# tree: these were either already clean or a handful of real fixes away, so they
# lock in behaviour rather than schedule a refactor.
extend-select = [
  "E4", "E7", "E9", "W", "E501",
  "I",       # import sorting: fully autofixable, so it stays sorted for free
  "A",       # builtin shadowing
  "ASYNC", "EXE", "FA", "INT", "SLOT", "TID", "YTT", "PYI",
  "B",       # bugbear: mutable defaults, loop-variable capture in closures
  "C4",      # comprehension rewrites
  "COM818",  # bare trailing comma creates a tuple by accident
  "DTZ",     # naive datetimes: the survey store and manifests disagree today
  "ERA",     # commented-out code
  "FURB", "G", "ISC", "LOG", "PERF", "PIE", "Q", "RET", "SIM",
  "T20",     # stray print()
  "PLW", "PLC0207", "PLR1714", "PLR1730", "PLR5501",
  "N",       # naming: Qt overrides are allowlisted below, not noqa'd per site
  "S310",    # urlopen without a scheme check
  "RUF100",  # unused noqa. Last, and only now: it can only see enabled rules,
             # so turning it on before N and S310 would have deleted the
             # comments documenting exactly those.
]
# PLW1514 (open without an explicit encoding) is selected by the PLW above but
# only fires under --preview. The tree is clean under it, so it starts green the
# day it graduates rather than arriving as a backlog. Check with:
#   uv run ruff check --preview --select PLW1514 deepreefmap_gui tests
# Still deferred: S110 and S112 (try/except/pass and /continue). Each is a
# judgement about whether a swallowed exception is deliberate, so they are being
# handled per site rather than by a sweep, and the rule goes on when the count
# reaches zero. S101 stays off for good: it is `assert`, which is what a test is
# made of.
extend-ignore = [
  # Suppressing an exception is sometimes right and sometimes a hidden bug; that
  # call needs a human, so it is being made per-site rather than by autofix.
  "SIM105",
  # if/else -> ternary. Frequently less readable at this line length.
  "SIM108",
  # try/except inside a loop is how per-item failures are isolated here, which
  # is a correctness choice, not an oversight.
  "PERF203",
]

[tool.ruff.lint.pep8-naming]
# Qt's method names are Qt's to spell, so an override cannot be renamed into
# snake_case without silently ceasing to override anything. Declared once here
# rather than carried as a `# noqa: N802` comment on each of the ~27 sites: the
# vocabulary is closed, and a comment per site documents nothing the rule does
# not already say.
extend-ignore-names = [
  "acceptProposedAction",
  "cvtColor",
  "eventFilter",
  "hasUrls",
  "leaveEvent",
  "mimeData",
  "mouseDoubleClickEvent",
  "mouseMoveEvent",
  "mousePressEvent",
  "mouseReleaseEvent",
  "paintEvent",
  "setBegin",
  "setEnd",
  "setText",
  "showEvent",
  "wheelEvent",
  # N818 wants an Error suffix. These three are cancellations, not faults: they
  # unwind a copy the user stopped, and are caught by name where they are
  # raised. Renaming them would say something untrue about what they mean.
  "PackCancelled",
  "DownloadCancelled",
  "InsufficientDiskSpace",
]

# INP001 is deliberately absent: tests/ has no __init__.py by design (see the
# --import-mode=importlib note under [tool.pytest.ini_options]), and enabling it
# would flag all 62 test modules for following the documented layout.

[tool.mypy]
python_version = "3.10"

# The library ships no py.typed marker, so treat it as untyped rather than
# erroring on every import; checking its internals stays in its own repo.
[[tool.mypy.overrides]]
module = ["deepreefmap.*"]
follow_imports = "silent"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "pyvistaqt.*",
  "vtk.*",
  "psutil.*",
  "zarr.*",
  "numcodecs.*",
  "imohash.*",
]
ignore_missing_imports = true

# numpy 2.5 stubs use PEP 695 `type` statements, which mypy rejects under
# python_version 3.10 (numpy <2.5 is what actually installs there). Skip the
# stubs rather than pin numpy for the type checker's sake.
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true
