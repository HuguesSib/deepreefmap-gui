# py-gpmf-parser (GoPro telemetry, the library's `gopro` extra) publishes Linux
# x86_64 wheels only, so macOS and Windows installs get no gravity alignment. Its
# source builds anywhere pybind11 does; this builds the missing wheels from the
# pinned upstream commit and attaches them to a release named after the version.
#
# Once a release exists, wire it into pyproject.toml as a direct dependency of
# the app (the library's extra keeps its Linux marker):
#   dependencies = [..., "py-gpmf-parser==0.1.1"]
#   [tool.uv.sources]
#   py-gpmf-parser = [
#     { url = "https://github.com/eceo-epfl/deepreefmap-gui/releases/download/py-gpmf-parser-0.1.1/py_gpmf_parser-0.1.1-cp311-cp311-macosx_11_0_arm64.whl",
#       marker = "sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.11'" },
#     ...one entry per (platform, python) wheel...
#   ]
name: py-gpmf-parser wheels

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream py-gpmf-parser git ref to build
        required: true
        default: v0.1.1
      version:
        description: Version the wheels carry (names the release)
        required: true
        default: 0.1.1

jobs:
  build:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
    env:
      # Pins the macOS wheel tag to macosx_11_0_arm64, so the URLs are predictable.
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - name: Check out py-gpmf-parser
        uses: actions/checkout@v7
        with:
          repository: urbste/py-gpmf-parser
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Smoke-test the wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python -c "from py_gpmf_parser.gopro_telemetry_extractor import GoProTelemetryExtractor; print('ok')"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl

  release:
    name: Attach wheels to the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect wheels
        uses: actions/download-artifact@v4
        with:
          path: wheels
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: py-gpmf-parser-${{ inputs.version }}
          name: py-gpmf-parser ${{ inputs.version }} wheels
          body: >
            Wheels of urbste/py-gpmf-parser at ${{ inputs.ref }} for the platforms
            PyPI does not carry.
          files: wheels/*.whl
