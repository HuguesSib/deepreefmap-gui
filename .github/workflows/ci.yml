name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# deepreefmap is pinned in pyproject.toml as a git direct reference (@<sha>), so
# `uv sync` here, the built wheel, and the PyApp binary all resolve it from GitHub
# at that commit. The library repo is public, so no token is needed to fetch it.
env:
  QT_QPA_PLATFORM: xcb
  LIBGL_ALWAYS_SOFTWARE: "1"

jobs:
  test:
    name: pytest + ruff (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The suite runs in about two minutes, so the room here is for a slow
    # runner and the installs, not for the tests. A hung test is caught far
    # sooner by the per-test timeout in pyproject.toml; this ceiling only has
    # to stop a wedged runner from billing hours before anyone notices.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out gui repository
        uses: actions/checkout@v6

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          qt-libs: "true"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install virtual display and software OpenGL
        run: sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri

      - name: Install project (dev extra)
        run: uv sync --python ${{ matrix.python-version }} --extra dev

      - name: Lint (ruff)
        run: uv run --python ${{ matrix.python-version }} ruff check deepreefmap_gui tests

      # DEEPREEFMAP_REQUIRE_TORCH turns the GUI suite's torch skip into a failure:
      # torch is installed here, so a skip would mean most of the suite silently
      # did not run.
      - name: Test (pytest)
        env:
          DEEPREEFMAP_REQUIRE_TORCH: "1"
        # -n 2 over the serial default in pyproject.toml: a worker holds torch
        # and VTK, and the runner has 16 GB for four cores.
        run: xvfb-run -a -s "-screen 0 1920x1200x24" uv run --python ${{ matrix.python-version }} pytest -q -n 2

      - name: Coverage
        if: matrix.python-version == '3.12'
        env:
          DEEPREEFMAP_REQUIRE_TORCH: "1"
        run: >
          xvfb-run -a -s "-screen 0 1920x1200x24" uv run --python 3.12 pytest -q -n 2
          --cov=deepreefmap_gui --cov-report=term-missing:skip-covered

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - name: Check out gui repository
        uses: actions/checkout@v6

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          qt-libs: "true"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project (dev extra)
        run: uv sync --python 3.12 --extra dev

      - name: Type check (mypy)
        run: uv run --python 3.12 mypy deepreefmap_gui
